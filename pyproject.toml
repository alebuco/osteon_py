[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osteon-viewer"
version = "0.0.4"
description = "Visualizador DICOM clean-room: 2D/MPR/3D, modelo STL, segmentacao e registro."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6,<6.9",
    "vtk>=9.3",
    "pydicom>=2.4",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.22",
    "reportlab>=4.0",
]

[project.gui-scripts]
osteon = "osteon.app:main"

[tool.setuptools.packages.find]
include = ["osteon*"]
