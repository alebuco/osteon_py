name: build

# Compila o Osteon Viewer (Python/PySide6/VTK) com PyInstaller e gera os
# instaladores: Windows (.exe via Inno Setup) e Linux (AppImage).
# Dispare na aba Actions (Run workflow) ou criando uma tag v*.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - run: pyinstaller packaging/osteon.spec
      - name: Instalador (Inno Setup)
        run: |
          iscc packaging\osteon.iss
      - uses: actions/upload-artifact@v4
        with:
          name: osteon-windows
          path: dist/installer/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências de sistema (Qt/VTK runtime + fuse p/ AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglx-mesa0 libxkbcommon0 libegl1 \
            libdbus-1-3 libxcb-cursor0 fuse libfuse2
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - run: pyinstaller packaging/osteon.spec
      - run: bash packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: osteon-linux
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
